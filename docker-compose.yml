services:
  postgres:
    image: postgres:16-alpine
    container_name: campusbridge-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: campusbridge
    ports:
      - "5432:5432"
    volumes:
      - campusbridge_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d campusbridge"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  campusbridge_pgdata:
